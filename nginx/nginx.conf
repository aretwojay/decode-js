events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:js|css|json)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri =404;
        }

        location ~ ^/(portfolio|cv|contact|admin|table|gallery|experiences|signup|login|mentions-legales|confidentialite)(/.*)?$ {
            try_files $uri /index.html;
        }

        location /api/ {
            proxy_pass http://strapi:1337/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /uploads/ {
            proxy_pass http://strapi:1337/uploads/;
        }

        location /strapi-admin/ {
            proxy_pass http://strapi:1337/admin/;
        }
    }
}
