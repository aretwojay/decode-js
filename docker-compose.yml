services:
  strapi:
    build: ./backend
    container_name: decode-strapi
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - strapi_data:/app/.tmp
    ports:
      - "1337:1337"
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: decode-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - strapi

volumes:
  strapi_data:
